# nginx configuration for the AI Company OS web container.
#
# Responsibilities:
#   * serve the built SPA and fall back to index.html for client-side routes
#   * proxy /api to the api service on the internal Docker network
#   * never expose the database or worker; only this container is published
#
# Security headers are set here because the SPA is the only public entrypoint.

# Docker's embedded DNS server. Needed so a recreated `api` container (new IP)
# is picked up without restarting the web container: nginx resolves upstream
# names only at startup unless proxy_pass uses a variable with a resolver.
resolver 127.0.0.11 valid=10s ipv6=off;

server {
    listen 8080;
    server_name _;

    root /usr/share/nginx/html;
    index index.html;

    # Resolved per-request through the variable below.
    set $acos_api_upstream "http://host.docker.internal:64637";

    # Do not advertise the nginx version.
    server_tokens off;

    client_max_body_size 8m;

    # Compression for text assets.
    gzip on;
    gzip_vary on;
    gzip_min_length 1024;
    gzip_types text/plain text/css application/javascript application/json
               image/svg+xml application/wasm;

    include /etc/nginx/snippets/security-headers.conf;

    # API proxy. Cookies are first-party because the browser only ever talks to
    # this origin.
    location /api/ {
        proxy_pass $acos_api_upstream$request_uri;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_set_header Connection "";
        proxy_read_timeout 60s;
        proxy_send_timeout 60s;

        # API responses are dynamic; never cache them at the proxy. The
        # security snippet must be repeated because defining any add_header
        # here disables inheritance from the server block.
        include /etc/nginx/snippets/security-headers.conf;
        add_header Cache-Control "no-store" always;
    }

    # Hashed asset filenames are immutable.
    location /assets/ {
        expires 1y;
        include /etc/nginx/snippets/security-headers.conf;
        add_header Cache-Control "public, immutable" always;
        try_files $uri =404;
    }

    location = /index.html {
        include /etc/nginx/snippets/security-headers.conf;
        add_header Cache-Control "no-cache" always;
        try_files $uri =404;
    }

    # Client-side routing fallback. try_files rewrites to /index.html, which is
    # a static file served by this location, so the headers below apply.
    location / {
        try_files $uri $uri/ /index.html;
    }

    # Container healthcheck endpoint.
    location = /healthz {
        access_log off;
        default_type text/plain;
        return 200 "ok\n";
    }
}
