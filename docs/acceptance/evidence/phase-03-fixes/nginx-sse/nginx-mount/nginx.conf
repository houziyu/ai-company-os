# Minimal nginx main config for the non-root web container.
#
# The official image's default /etc/nginx/nginx.conf writes its pid to
# /run/nginx.pid and its temp paths to /var/cache/nginx, which the unprivileged
# nginx user cannot always write. All writable paths are pointed at /tmp here so
# the container can run without root and without a read-write root filesystem.

worker_processes auto;
pid /tmp/nginx.pid;
error_log /dev/stderr warn;

events {
    worker_connections 1024;
}

http {
    include /etc/nginx/mime.types;
    default_type application/octet-stream;

    # Temp paths must be writable by the unprivileged user.
    client_body_temp_path /tmp/client_body;
    proxy_temp_path /tmp/proxy;
    fastcgi_temp_path /tmp/fastcgi;
    uwsgi_temp_path /tmp/uwsgi;
    scgi_temp_path /tmp/scgi;

    log_format main '$remote_addr - $request_method $uri $status '
                    '$body_bytes_sent $request_time';
    access_log /dev/stdout main;

    sendfile on;
    tcp_nopush on;
    keepalive_timeout 65;
    server_tokens off;

    include /etc/nginx/conf.d/*.conf;
}
