# Security headers applied to every response.
#
# nginx only inherits `add_header` from the server block when the location block
# defines none of its own. Any location that sets a header (e.g. Cache-Control)
# must therefore include this snippet too, otherwise the security headers
# silently disappear for that path.

add_header X-Content-Type-Options "nosniff" always;
add_header X-Frame-Options "DENY" always;
add_header Referrer-Policy "same-origin" always;
add_header Permissions-Policy "camera=(), microphone=(), geolocation=()" always;
# 'unsafe-inline' is required for Vue scoped-style injection and Element Plus
# runtime styles. Scripts remain restricted to same-origin bundles.
add_header Content-Security-Policy "default-src 'self'; script-src 'self'; style-src 'self' 'unsafe-inline'; img-src 'self' data:; font-src 'self' data:; connect-src 'self'; frame-ancestors 'none'; base-uri 'self'; form-action 'self'" always;
